      - name: Test COAT API access
        env:
          api_COAT: ${{ secrets.COAT_API_KEY }}
        run: |
          if [ -z "$api_COAT" ]; then
            echo "COAT_API_KEY is empty or unavailable"
            exit 1
          fi

          echo "COAT_API_KEY is available"
          echo "Key length: ${#api_COAT}"

          response_file="$(mktemp)"

          http_status=$(
            curl --silent --show-error \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --request GET \
              --header "Authorization: $api_COAT" \
              "https://data.coat.no/api/3/action/package_show?id=v85_snowbed_dwarf_shrub_abundance_intensive_v2"
          )

          echo "COAT API HTTP status: $http_status"

          if [ "$http_status" != "200" ]; then
            echo "COAT API request failed. Response:"
            cat "$response_file"
            exit 1
          fi

          if grep -q '"success":true' "$response_file"; then
            echo "COAT API authentication and dataset lookup succeeded"
          else
            echo "COAT API returned an unsuccessful response:"
            cat "$response_file"
            exit 1
          fi

name: Render and publish Quarto figure

on:
  push:
    branches:
      - main
    paths:
      - "state_variables/**"
      - ".github/workflows/publish-quarto-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::ckanr
            any::dplyr
            any::plotly

      - name: Check COAT API secret
        env:
          api_COAT: ${{ secrets.COAT_API_KEY }}
        run: |
          if [ -z "$api_COAT" ]; then
            echo "COAT_API_KEY is missing"
            exit 1
          fi

          echo "COAT API key is available"
          echo "COAT API key length: ${#api_COAT}"

      - name: Render Quarto figure
        env:
          api_COAT: ${{ secrets.COAT_API_KEY }}
        run: |
          quarto render \
            state_variables/v85_snowbed_dwarf_shrub_abundance/plot_existing_state_variable.qmd \
            --output-dir _site/figures/v85_snowbed_dwarf_shrub_abundance

      - name: Create GitHub Pages landing page
        run: |
          mkdir -p _site

          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>COAT State Variable Figures</title>
          </head>
          <body>
            <h1>COAT State Variable Figures</h1>
            <p>
              Interactive figures generated from state variables in the
              COAT data portal.
            </p>
            <h2>Available figures</h2>
            <ul>
              <li>
                <a href="figures/v85_snowbed_dwarf_shrub_abundance/plot_existing_state_variable.html">
                  Dwarf shrub abundance in snowbeds
                </a>
              </li>
            </ul>
          </body>
          </html>
          EOF

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4